<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player Design - Easy Tutorials</title>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.0/css/all.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: #333;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        .reprod-musi {
            width: 400px;
            background-color: #ffe0e5; 
            padding: 40px 35px; 
        }

        nav {
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reprod-musi">
            <nav>
                <div class="anterior">
                    <i class="fa-whiteboard fa-semibold fa-angle-left"></i>
                </div>
                <div class="barres">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
        </div>
    </div>
</body>
</html>
