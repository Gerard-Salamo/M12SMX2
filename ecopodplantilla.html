<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player Design - Easy Tutorials</title>
    <script src="https://fontawesome.com" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .reprod-musi {
            width: 400px;
            background-color: #ffe0e5; /* El color rosado que buscabas */
            padding: 25px 35px;
            text-align: center;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reprod-musi">
            <nav>
                <div class="anterior">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="barres">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
        </div>
    </div>
</body>
</html>
