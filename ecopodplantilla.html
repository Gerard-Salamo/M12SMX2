<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player Design - Easy Tutorials</title>
    <!-- Link corregido para que los iconos carguen -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            height: 100vh;
            background: #333;
            display: flex; /* Centra el cuadro rosado */
            justify-content: center;
            align-items: center;
        }

        .reprod-musi {
            width: 400px;
            background-color: #ffe0e5; 
            padding: 25px 35px;
            /* Eliminamos text-align: center para que no amontone los iconos */
        }

        nav {
            display: flex; /* Alinea los iconos en una fila */
            justify-content: space-between; /* Separa los iconos (uno a cada lado) */
            align-items: center;
        }

        /* Estilos opcionales para que los iconos se vean como botones */
        .anterior, .barres {
            cursor: pointer;
            font-size: 20px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="reprod-musi">
            <nav>
                <div class="anterior">
                    <i class="fa-solid fa-angle-left"></i>
                </div>
                <div class="barres">
                    <i class="fa-solid fa-bars"></i>
                </div>
            </nav>
        </div>
    </div>
</body>
</html>
