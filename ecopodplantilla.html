<!doctype html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beta Reproductor de Música</title>
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v6.5.0/css/all.css"
    />
    <style>
      body {
        zoom: 0.9;
     }

      * {
        margin: 0;
        padding: 0;
        zoom: -10%;
        font-family: "Poppins", sans-serif;
        box-sizing: border-box;
      }

      .container {
        width: 100%;
        height: 100vh;
        background: #333;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .reprod-musi {
        width: 400px;
        background-color: #ffe0e5;
        padding: 40px 35px;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center; 
        margin-bottom: 30px;
      }

      nav .anterior,
      nav .barres {
        width: 40px;
        height: 40px;
        line-height: 40px;
        text-align: center; 
        background: #fff;
        border-radius: 50%;
        color: #f53192;
        box-shadow: 0 5px 10px rgba(255, 26, 26, 0.22);
        cursor: pointer;
      }

      .img-flexible {
        display: flex;
        justify-content: center;
      }

      .imgprova1 {
        width: 220px;
        height: 220px;
        display: block;       
        border-radius: 50%;
        border: 8px solid #fff;
        box-shadow: 0 10px 60px rgba(255, 26, 26, 0.22);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="reprod-musi">
        <nav>
          <div class="anterior">
            <i class="fa-solid fa-angle-left"></i>
          </div>
          <div class="barres">
            <i class="fa-solid fa-bars"></i>
          </div>
        </nav>
        <div class="img-flexible">
        <img src="imatges/paisatgeobert.png" class="imgprova1">
        </div>
      </div>
    </div>
  </body>
</html>
