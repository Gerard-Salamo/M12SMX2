<!doctype html>
<html lang="ca">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ECOPOD — Plataforma de Pòdcasts</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.0/css/all.css"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet"/>

    <style>
      *{margin:0;padding:0;box-sizing:border-box}

      :root{
        --ink:#111110;
        --paper:#f6f1e9;
        --warm:#eee9dd;
        --red:#d90000;
        --red-dark:#aa0000;
        --muted:#897e6e;
        --white:#ffffff;
        --sidebar-w:228px;
        --radius:4px;
      }

      body{
        font-family:"DM Sans",sans-serif;
        background:var(--paper);
        color:var(--ink);
        display:flex;
        min-height:100vh;
      }

      .sidebar{
        width:var(--sidebar-w);
        background:var(--ink);
        position:fixed;
        top:0;left:0;bottom:0;
        display:flex;
        flex-direction:column;
      }

      .sidebar-logo{
        display:flex;
        align-items:center;
        gap:13px;
        padding:28px 24px;
        text-decoration:none;
      }

      .logo-img{
        width:42px;height:42px;
        background:var(--red);
        border-radius:50%;
        display:grid;
        place-items:center;
      }

      .logo-name{
        font-family:"Syne",sans-serif;
        font-weight:800;
        color:var(--white);
      }

      .inici-pral{
        margin-left:var(--sidebar-w);
        flex:1;
        min-width:0;
      }

      .heroi{
        background:var(--ink);
        color:var(--white);
        padding:96px 56px;
        position:relative;
      }

      .btn-primary{
        display:inline-block;
        padding:16px 40px;
        background:var(--red);
        color:rgba(255,255,255,0.85); /* FIX */
        text-decoration:none;
      }

      .page-section{
        padding:64px 56px;
      }

      #eines{background:var(--warm)}
    </style>
  </head>

  <body>

    <aside class="sidebar">
      <a href="#presentacio" class="sidebar-logo">
        <div class="logo-img">🎧</div>
        <span class="logo-name">ECOPOD</span>
      </a>

      <nav class="naveg-lat">
        <a href="#presentacio">🏠 Inici</a>
        <a href="#podcasts">🎙️ Pòdcasts</a>
        <a href="#eines">🔧 Eines</a>
      </nav>
    </aside>

    <main class="inici-pral">

      <section class="heroi" id="presentacio">
        <h1>Les teves orelles</h1>
        <p>Plataforma de pòdcasts</p>
        <a href="#podcasts" class="btn-primary">Explora</a>
      </section>

      <section class="page-section" id="podcasts">
        <h2>Pòdcasts</h2>
      </section>

      <section class="page-section" id="eines">
        <h2>Eines</h2>
      </section>

      <section id="projecte" style="display:none">
        <h2>Projecte ECOPOD</h2>
      </section>

      <footer>
        © 2025 ECOPOD
      </footer>

    </main>

    <!-- ================= SCRIPT COMPLETO ================= -->
    <script>
      const navLinks = document.querySelectorAll(".naveg-lat a");

      const sectionObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (!entry.isIntersecting) return;

          navLinks.forEach(l => l.classList.remove("active"));

          const match = document.querySelector(
            `.naveg-lat a[href="#${entry.target.id}"]`
          );

          if (match) match.classList.add("active");
        });
      }, { threshold: 0.35 });

      document.querySelectorAll("section[id]").forEach(s => {
        if (s.id !== "projecte" && s.id !== "perfil") {
          sectionObserver.observe(s);
        }
      });

      const toolsGrid = document.getElementById("toolsGrid");

      if (toolsGrid) {
        toolsGrid.addEventListener("click", (e) => {
          const card = e.target.closest(".tool-card");
          if (!card) return;

          const tool = card.dataset.tool;

          if (tool === "player") {
            document.getElementById("playerModal")?.classList.add("open");
            return;
          }

          toolsGrid.style.display = "none";

          const panel = document.getElementById("panel-" + tool);
          if (panel) panel.classList.add("active");
        });
      }

      document.querySelectorAll("[data-back]").forEach(btn => {
        btn.addEventListener("click", () => {
          btn.closest(".tool-panel")?.classList.remove("active");
          if (toolsGrid) toolsGrid.style.display = "";
        });
      });

      const qrBtn = document.getElementById("qrBtn");

      qrBtn?.addEventListener("click", () => {
        const val = document.getElementById("qrInput").value.trim();
        const out = document.getElementById("qrOutput");

        if (!val) {
          out.innerHTML = `<span style="color:var(--red)">Escriu alguna cosa</span>`;
          return;
        }

        out.innerHTML = `
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(val)}">
        `;
      });

      const calcScreen = document.getElementById("calcScreen");

      document.querySelector(".calc-grid")?.addEventListener("click", (e) => {
        const btn = e.target.closest(".calc-key");
        if (!btn) return;

        const { action, val } = btn.dataset;

        if (action === "digit") calcScreen.value += val;
        else if (action === "op") calcScreen.value += val;
        else if (action === "del") calcScreen.value = calcScreen.value.slice(0,-1);
        else if (action === "clear") calcScreen.value = "";
        else if (action === "eval") {
          try {
            calcScreen.value = Function('"use strict";return (' + calcScreen.value + ')')();
          } catch {
            calcScreen.value = "Error";
          }
        }
      });

      document.addEventListener("keydown", (e) => {
        if (!document.getElementById("panel-calc")?.classList.contains("active")) return;

        if (/^[0-9.]$/.test(e.key)) calcScreen.value += e.key;
        else if ("+-*/".includes(e.key)) calcScreen.value += e.key;
        else if (e.key === "Enter") document.querySelector('[data-action="eval"]')?.click();
        else if (e.key === "Backspace") calcScreen.value = calcScreen.value.slice(0,-1);
        else if (e.key === "Escape") calcScreen.value = "";
      });

      const playerModal = document.getElementById("playerModal");
      const barraModal = document.getElementById("barraModal");
      const audioModal = document.getElementById("audioModal");
      const iconaModal = document.getElementById("iconaModal");

      function tancarModal() {
        playerModal?.classList.remove("open");
        if (audioModal) {
          audioModal.pause();
          audioModal.currentTime = 0;
        }
        if (barraModal) barraModal.value = 0;
        iconaModal?.classList.replace("fa-pause","fa-play");
      }

      playerModal?.addEventListener("click", (e) => {
        if (e.target === playerModal) tancarModal();
      });

      document.getElementById("modalClose")?.addEventListener("click", tancarModal);

      document.getElementById("btnTancarModal")?.addEventListener("click", tancarModal);

      document.getElementById("btnPerfil")?.addEventListener("click", () => {
        tancarModal();
        document.getElementById("perfil")?.scrollIntoView({ behavior: "smooth" });
      });

      function playPauseModal() {
        if (!audioModal || !iconaModal) return;

        if (iconaModal.classList.contains("fa-pause")) {
          audioModal.pause();
          iconaModal.classList.replace("fa-pause","fa-play");
        } else {
          audioModal.play();
          iconaModal.classList.replace("fa-play","fa-pause");
        }
      }
    </script>

  </body>
</html>
