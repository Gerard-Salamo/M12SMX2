<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ECOPOD — Plataforma de Pòdcasts</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.0/css/all.css"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <style>
    /* --- (TOT EL TEU CSS ES QUEDA IGUAL — EL TENS BÉ) --- */
  </style>
</head>

<body>

<aside class="sidebar">
  <a href="#presentacio" class="sidebar-logo">
    <div class="logo-img">🎧</div>
    <span class="logo-name">ECOPOD</span>
  </a>

  <nav class="naveg-lat">
    <a href="#presentacio"><span class="naveg-icona">🏠</span> Inici</a>
    <a href="#podcasts"><span class="naveg-icona">🎙️</span> Pòdcasts</a>
    <a href="#eines"><span class="naveg-icona">🔧</span> Eines extra</a>
  </nav>

  <div class="sidebar-bottom">© 2025–2026 ECOPOD</div>
</aside>

<main class="inici-pral">

  <!-- HERO -->
  <section class="heroi" id="presentacio">
    <h1>Les teves orelles mereixen més</h1>
  </section>

  <!-- PODCASTS -->
  <section id="podcasts">
    <h2>Pòdcasts</h2>
  </section>

  <!-- EINES -->
  <section id="eines">
    <div class="tools-grid" id="toolsGrid">

      <div class="tool-card" data-tool="qr">🔗 QR</div>
      <div class="tool-card" data-tool="calc">🧮 Calc</div>
      <div class="tool-card" data-tool="player">🎵 Player</div>

    </div>

    <div class="tool-panel" id="panel-qr">
      <button data-back>← Tornar</button>
      <input id="qrInput" placeholder="Text..." />
      <button id="qrBtn">Generar</button>
      <div id="qrOutput"></div>
    </div>

    <div class="tool-panel" id="panel-calc">
      <button data-back>← Tornar</button>
      <input id="calcScreen" readonly />
      <div class="calc-grid"></div>
    </div>
  </section>

  <!-- PROJECTE -->
  <section id="projecte" style="display:none">
    <h2>Projecte ECOPOD</h2>
  </section>

  <footer>
    <a href="#projecte" id="link-projecte">El nostre projecte</a>
  </footer>

</main>

<!-- MODAL PLAYER -->
<div class="modal-overlay" id="playerModal">
  <div class="modal-box">

    <button id="modalClose">×</button>

    <h3>Paisatge Obert</h3>

    <audio id="audioModal">
      <source src="audiosprova/cinematic-slow-background-305617.mp3" type="audio/mpeg">
    </audio>

    <button onclick="playPauseModal()">Play/Pause</button>

  </div>
</div>

<script>
/* =======================
   NAV ACTIVE FIX
======================= */
const navLinks = document.querySelectorAll(".naveg-lat a");

const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;

    navLinks.forEach(a => a.classList.remove("active"));

    const match = document.querySelector(`.naveg-lat a[href="#${entry.target.id}"]`);
    if (match) match.classList.add("active");
  });
}, { threshold: 0.35 });

document.querySelectorAll("section[id]").forEach(sec => {
  if (sec.id !== "projecte") observer.observe(sec);
});


/* =======================
   TOOLS SWITCH
======================= */
const toolsGrid = document.getElementById("toolsGrid");

toolsGrid.addEventListener("click", (e) => {
  const card = e.target.closest(".tool-card");
  if (!card) return;

  const tool = card.dataset.tool;

  if (tool === "player") {
    document.getElementById("playerModal").classList.add("open");
    return;
  }

  toolsGrid.style.display = "none";
  document.getElementById("panel-" + tool)?.classList.add("active");
});


document.querySelectorAll("[data-back]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tool-panel")
      .forEach(p => p.classList.remove("active"));

    toolsGrid.style.display = "grid";
  });
});


/* =======================
   QR FIX
======================= */
document.getElementById("qrBtn").addEventListener("click", () => {
  const val = document.getElementById("qrInput").value.trim();
  const out = document.getElementById("qrOutput");

  if (!val) {
    out.textContent = "Escriu alguna cosa";
    return;
  }

  out.innerHTML =
    `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(val)}">`;
});


/* =======================
   CALC FIX (segur)
======================= */
const calcScreen = document.getElementById("calcScreen");

document.addEventListener("click", (e) => {
  const btn = e.target.closest(".calc-key");
  if (!btn) return;

  const val = btn.dataset.val;
  const action = btn.dataset.action;

  if (action === "digit" || action === "op") {
    calcScreen.value += val;
  }

  if (action === "clear") calcScreen.value = "";
  if (action === "del") calcScreen.value = calcScreen.value.slice(0, -1);

  if (action === "eval") {
    try {
      calcScreen.value = Function("return " + calcScreen.value)();
    } catch {
      calcScreen.value = "Error";
    }
  }
});


/* =======================
   MODAL PLAYER FIX
======================= */
const modal = document.getElementById("playerModal");
const audio = document.getElementById("audioModal");

function closeModal() {
  modal.classList.remove("open");
  audio.pause();
  audio.currentTime = 0;
}

document.getElementById("modalClose").addEventListener("click", closeModal);

modal.addEventListener("click", (e) => {
  if (e.target === modal) closeModal();
});

function playPauseModal() {
  if (audio.paused) audio.play();
  else audio.pause();
}


/* =======================
   PROJECTE FIX (sense bugs)
======================= */
document.getElementById("link-projecte").addEventListener("click", (e) => {
  e.preventDefault();

  document.querySelectorAll("main > section").forEach(s => {
    if (s.id !== "projecte") s.style.display = "none";
  });

  document.getElementById("projecte").style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>

</body>
</html>
